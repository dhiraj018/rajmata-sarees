<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rajmata Sarees | Luxury Handloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">RAJMATA SAREES</div>
    <div class="nav-actions">
      <button id="accountBtn" class="nav-btn">Sign In</button>
      <button id="bagBtn" class="nav-btn">Bag (0)</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Authentic Paithani & Handloom Aesthetics</h1>
      <p>Direct WhatsApp automated checkout • Real-time dispatch hub</p>
    </section>

    <div class="product-grid" id="productGrid">
      <!-- Product Card 1 -->
      <div class="product-card">
        <div class="product-img-placeholder"></div>
        <div class="product-info">
          <h3>Royal Maroon Paithani</h3>
          <p class="price">₹12,500</p>
          <button class="btn-primary quick-order-btn" data-name="Royal Maroon Paithani" data-price="12500">Quick Order</button>
        </div>
      </div>
      <!-- Product Card 2 -->
      <div class="product-card">
        <div class="product-img-placeholder" style="background-color: #C59B27;"></div>
        <div class="product-info">
          <h3>Antique Zari Silk</h3>
          <p class="price">₹18,000</p>
          <button class="btn-primary quick-order-btn" data-name="Antique Zari Silk" data-price="18000">Quick Order</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Account Sign In Modal -->
  <div id="accountModal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <h2>ACCOUNT SIGN IN</h2>
      <p>Enter your details to save your delivery address for faster checkout.</p>
      <form id="loginForm">
        <input type="text" id="custName" placeholder="Full Name" required>
        <input type="tel" id="custPhone" placeholder="WhatsApp Number (10 digits)" pattern="[0-9]{10}" required>
        <input type="password" id="custPin" placeholder="Security PIN (4 digits)" maxlength="4" required>
        <textarea id="custAddress" placeholder="Delivery Address & Pincode" required></textarea>
        <button type="submit" class="btn-primary">SIGN IN / REGISTER</button>
      </form>
    </div>
  </div>

  <!-- FIX APPLIED HERE: Changed type="module" to defer -->
  <script defer src="app.js"></script>
</body>
</html>
